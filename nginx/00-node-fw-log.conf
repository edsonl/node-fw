# Node FW - definicoes no contexto http do Nginx
#
# Este arquivo precisa ser incluido ANTES dos server blocks que usam
# o formato security_json. No servidor local ele fica em:
#   /home/edson/www/nginx/00-node-fw-log.conf
# porque /etc/nginx/nginx.conf inclui /home/edson/www/nginx/*.conf
# em ordem alfabetica dentro do contexto http.
#
# Em producao, a opcao mais segura e:
#   /etc/nginx/conf.d/00-node-fw-log.conf
# (conf.d e incluido antes de sites-enabled e do diretorio acima).

# Caminho original sem query string. O fallback mantem $request_uri
# caso a expressao regular nao seja aplicada pela versao do Nginx.
map $request_uri $nodefw_request_path {
    default $request_uri;
    "~^(?<nodefw_path_only>[^?]*)" $nodefw_path_only;
}

# 1 quando houve encaminhamento a um upstream (PHP-FPM), 0 caso contrario.
map $upstream_addr $nodefw_dynamic {
    ""      0;
    default 1;
}

log_format security_json escape=json
'{'
  '"timestamp":"$time_iso8601",'
  '"request_id":"$request_id",'
  '"site":"$host",'
  '"server_name":"$server_name",'
  '"ip":"$remote_addr",'
  '"method":"$request_method",'
  '"path":"$nodefw_request_path",'
  '"final_uri":"$uri",'
  '"status":$status,'
  '"request_time":$request_time,'
  '"upstream_addr":"$upstream_addr",'
  '"upstream_time":"$upstream_response_time",'
  '"dynamic":$nodefw_dynamic,'
  '"scheme":"$scheme",'
  '"body_bytes_sent":$body_bytes_sent,'
  '"user_agent":"$http_user_agent"'
'}';
