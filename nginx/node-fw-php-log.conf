# Node FW - log de seguranca via Syslog UDP
#
# Incluir SOMENTE dentro de locations que executam PHP/FastCGI.
# No servidor local a include abaixo e usada em casadoppia.conf:
#   include /home/edson/www/node-fw/nginx/node-fw-php-log.conf;
#
# Em producao, copiar para /etc/nginx/snippets/node-fw-php-log.conf
# e ajustar o caminho do include no vhost.
#
# O tag deve ser igual a SYSLOG_TAG do Node FW (padrao: nodefw).
# O facility local6 nao e usado pelo restante da configuracao.
access_log syslog:server=127.0.0.1:5514,facility=local6,tag=nodefw,severity=info,nohostname security_json;
